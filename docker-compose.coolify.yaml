services:
  neo4j:
    image: neo4j:5.26-community
    container_name: mirofish-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${GRAPH_USER:-neo4j}/${GRAPH_PASSWORD:-mirofish123}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -a bolt://localhost:7687 -u ${GRAPH_USER:-neo4j} -p
            ${GRAPH_PASSWORD:-mirofish123} 'RETURN 1;' > /dev/null 2>&1 || exit
            1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s
    networks:
      - mirofish-internal

  mirofish:
    build: .
    container_name: mirofish
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${GRAPH_USER:-neo4j}
      - NEO4J_PASSWORD=${GRAPH_PASSWORD:-mirofish123}
    # No ports exposed directly — only reachable via proxy
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - mirofish-internal

  proxy:
    image: caddy:2-alpine
    container_name: mirofish-proxy
    restart: unless-stopped
    environment:
      - PROXY_USER=${PROXY_USER}
      - PROXY_PASSWORD_HASH=${PROXY_PASSWORD_HASH}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mirofish
    networks:
      - mirofish-internal

configs:
  caddyfile:
    content: |
      :80 {
          basic_auth * {
              {env.PROXY_USER} {env.PROXY_PASSWORD_HASH}
          }
          reverse_proxy /api/* mirofish:5001 {
              header_up Host localhost
              transport http {
                  response_header_timeout 600s
                  dial_timeout 30s
              }
              flush_interval -1
          }
          reverse_proxy mirofish:3000 {
              header_up Host localhost
          }
      }

volumes:
  neo4j_data:
  caddy_data:
  caddy_config:

networks:
  mirofish-internal:
    driver: bridge
