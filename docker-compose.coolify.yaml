services:
  neo4j:
    image: neo4j:5.26-community
    container_name: mirofish-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-mirofish123}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mirofish-internal

  mirofish:
    image: ghcr.io/666ghj/mirofish:latest
    container_name: mirofish
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-mirofish123}
    # No ports exposed directly — only reachable via proxy
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - mirofish-internal

  proxy:
    image: caddy:2-alpine
    container_name: mirofish-proxy
    restart: unless-stopped
    environment:
      - PROXY_USER=${PROXY_USER}
      - PROXY_PASSWORD_HASH=${PROXY_PASSWORD_HASH}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mirofish
    networks:
      - mirofish-internal

configs:
  caddyfile:
    content: |
      :80 {
          basic_auth * {
              {env.PROXY_USER} {env.PROXY_PASSWORD_HASH}
          }
          reverse_proxy /api/* mirofish:5001 {
              header_up Host localhost
          }
          reverse_proxy mirofish:3000 {
              header_up Host localhost
          }
      }

volumes:
  neo4j_data:
  caddy_data:
  caddy_config:

networks:
  mirofish-internal:
    driver: bridge
