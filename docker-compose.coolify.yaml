services:
  mirofish:
    image: ghcr.io/666ghj/mirofish:latest
    container_name: mirofish
    env_file:
      - .env
    # No ports exposed directly — only reachable via proxy
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
    networks:
      - mirofish-internal

  proxy:
    image: caddy:2-alpine
    container_name: mirofish-proxy
    restart: unless-stopped
    environment:
      - PROXY_USER=${PROXY_USER}
      - PROXY_PASSWORD_HASH=${PROXY_PASSWORD_HASH}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mirofish
    networks:
      - mirofish-internal

configs:
  caddyfile:
    content: |
      :80 {
          basic_auth * {
              {env.PROXY_USER} {env.PROXY_PASSWORD_HASH}
          }
          reverse_proxy mirofish:3000
      }

volumes:
  caddy_data:
  caddy_config:

networks:
  mirofish-internal:
    driver: bridge
